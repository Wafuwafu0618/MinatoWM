[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["sample"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
minato-layout = { path = "crates/minato-layout" }
minato-config = { path = "crates/minato-config" }
minato-wm = { path = "crates/minato-wm" }
minato-ui = { path = "crates/minato-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
crossbeam-channel = "0.5"
arc-swap = "1"
regex = "1"
dirs = "6"
notify = "8"
windows-sys = "0.61"
gpui-kit = "0.9.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds small: full debuginfo for the GPUI dependency tree
# alone runs to many gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
