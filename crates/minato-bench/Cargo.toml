[package]
name = "minato-bench"
description = "Drives a running MinatoWM through its control pipe and measures it"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "minato-bench"
path = "src/main.rs"

[dependencies]
minato-config = { workspace = true }
minato-wm = { workspace = true }
minato-layout = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]
