[package]
name = "minato-wm"
description = "Window manager core for MinatoWM: state, Win32 integration, hooks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
minato-layout = { workspace = true }
minato-config = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
crossbeam-channel = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Magnification",
  "Win32_UI_WindowsAndMessaging",
]

# COM APIs (DirectComposition / Direct3D) for the animation overlay.
[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]
